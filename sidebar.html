  <title>VEIT Sidebar</title>

  <style>
    /* Sidebar */
    #sidebar {
      transition: width 0.3s;
      background-color: #0D1628;
    }

    .profile-box {
      background: #0F1B31;
      border-top: 1px solid #1F2A44;
    }

    .tooltip {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      background-color: #1E293B;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.875rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      margin-left: 8px;
      z-index: 50;
    }

    #sidebar.collapsed .menu-item:hover .tooltip {
      opacity: 1;
    }

    .hide-collapsed {
      transition: opacity 0.3s, width 0.3s;
    }

    #sidebar.collapsed .hide-collapsed {
      opacity: 0;
      display: none;
    }

    #sidebar.collapsed .profile-text {
      display: none;
    }

    #sidebar.collapsed .profile-box {
      justify-content: center;
    }

    .mini-logo {
      display: none;
    }

    #sidebar.collapsed .mini-logo {
      display: inline-block;
    }

    #sidebar.collapsed .full-logo {
      display: none;
    }
  </style>
</head>

  <!-- SIDEBAR TOGGLE SCRIPT -->
  <script>
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleSidebar");
    const mainContent = document.getElementById("mainContent");
    const menuTexts = document.querySelectorAll(".menu-text");

    let isClosed = false;

    toggleBtn.addEventListener("click", () => {
      isClosed = !isClosed;

      if (isClosed) {
        sidebar.classList.add("w-16", "collapsed");
        sidebar.classList.remove("w-64");
        menuTexts.forEach(el => el.classList.add("hidden"));
        mainContent.classList.remove("ml-64");
        mainContent.classList.add("ml-16");
      } else {
        sidebar.classList.remove("w-16", "collapsed");
        sidebar.classList.add("w-64");
        menuTexts.forEach(el => el.classList.remove("hidden"));
        mainContent.classList.remove("ml-16");
        mainContent.classList.add("ml-64");
      }
    });
  </script>
