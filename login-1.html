<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Login - VEIT</title>
</head>

<body class="bg-[#011239] h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-xl rounded-2xl shadow-lg p-8">
    
    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <img src="./assest/img/logo/VEIT.svg" alt="Logo" class="w-20 h-20">
    </div>

    <!-- Title -->
    <h2 class="text-center text-[28px] font-medium text-black">Login to VEIT</h2>
    <p class="text-center text-[#344054] font-normal text-[#344054] mt-1 text-sm">
      Enter your credentials to log in to your account.
    </p>

    <!-- Form -->
    <form class="mt-6 space-y-5">

      <!-- Email -->
      <div>
        <label class="block text-[#475367] font-medium text-sm mb-1">Email</label>
        <input 
          type="email"
          class="w-full border border-[#D0D5DD] text-[#98A2B3] font-normal test-sm rounded-lg px-4 py-2 focus:border-blue-500 focus:ring-blue-500"
          placeholder="Enter your email"
        >
      </div>

      <!-- Password -->
      <div>
        <label class="block text-[#475367] font-medium text-sm mb-1">Password</label>
        <div class="relative">
          <input 
            type="password"
            id="password"
            class="w-full border border-[#D0D5DD] text-[#98A2B3] font-normal test-sm rounded-lg px-4 py-2 pr-10 focus:border-blue-500 focus:ring-blue-500"
            placeholder="Enter your password"
          >
          <!-- Eye Icon -->
          <span onclick="togglePassword()" class="absolute right-3 top-2.5 cursor-pointer text-gray-500">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.2554 2.74408C17.5808 3.06951 17.5808 3.59715 17.2554 3.92259L3.92206 17.2559C3.59662 17.5814 3.06899 17.5814 2.74355 17.2559C2.41811 16.9305 2.41811 16.4028 2.74355 16.0774L16.0769 2.74408C16.4023 2.41864 16.93 2.41864 17.2554 2.74408Z" fill="#667185"/>
                <path d="M13.1657 4.4767C12.2272 4.03469 11.1689 3.75 9.99946 3.75C7.54604 3.75 5.58177 5.00308 4.1858 6.33307C2.78661 7.66611 1.87872 9.14973 1.51934 9.7915C1.28382 10.2121 1.25577 10.7143 1.44909 11.1603C1.5841 11.4718 1.81371 11.9544 2.15212 12.5143C2.39016 12.9082 2.90245 13.0346 3.29635 12.7965C3.69024 12.5585 3.81659 12.0462 3.57854 11.6523C3.30635 11.2019 3.11748 10.8124 3.00291 10.5537C3.34104 9.95778 4.14184 8.67693 5.33544 7.53975C6.56834 6.36513 8.14116 5.41667 9.99946 5.41667C10.6678 5.41667 11.2993 5.53937 11.8913 5.75116L13.1657 4.4767Z" fill="#667185"/>
                <path d="M14.7416 7.61491C15.892 8.73288 16.6653 9.97087 16.996 10.5537C16.8814 10.8124 16.6926 11.2019 16.4204 11.6523C16.1823 12.0462 16.3087 12.5585 16.7026 12.7965C17.0965 13.0346 17.6087 12.9082 17.8468 12.5143C18.1852 11.9544 18.4148 11.4718 18.5498 11.1603C18.7431 10.7143 18.7151 10.2121 18.4796 9.7915C18.1294 9.16625 17.2587 7.74193 15.9202 6.43629L14.7416 7.61491Z" fill="#667185"/>
                <path d="M9.99947 6.66667C10.3023 6.66667 10.5976 6.69898 10.8821 6.76034L9.16725 8.47519C8.45601 8.7262 7.89234 9.28987 7.64133 10.0011L5.92647 11.716C5.86511 11.4315 5.8328 11.1362 5.8328 10.8333C5.8328 8.53215 7.69828 6.66667 9.99947 6.66667Z" fill="#667185"/>
                <path d="M9.99947 13.3333C9.70708 13.3333 9.4264 13.2831 9.1656 13.1909L7.91473 14.4418C8.52791 14.7968 9.23996 15 9.99947 15C12.3007 15 14.1661 13.1345 14.1661 10.8333C14.1661 10.0738 13.9629 9.36177 13.6079 8.74859L12.357 9.99947C12.4493 10.2603 12.4995 10.5409 12.4995 10.8333C12.4995 12.214 11.3802 13.3333 9.99947 13.3333Z" fill="#667185"/>
                </svg>
          </span>
        </div>
      </div>

      <!-- Remember + Forgot -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-[#717179] text-base font-normal">
          <input type="checkbox" class="accent-[#022063]">
          Remember me
        </label>

        <a href="#" class="text-[#667185] text-sm font-medium hover:underline">Forgot Password?</a>
      </div>

      <!-- Login Button -->
      <button 
        class="w-full bg-[#022063] text-white py-2 rounded-lg text-sm font-semibold transition">
        Login
      </button>
    </form>

    <!-- Footer -->
    <p class="text-center text-[#12121266] text-sm font-medium mt-5">
      Don’t have an account?
      <a href="#" class="text-[#022063] text-sm font-medium hover:underline">Create Account</a>
    </p>
  </div>

  <script>
    function togglePassword() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
